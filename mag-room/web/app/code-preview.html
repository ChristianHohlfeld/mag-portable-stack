<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAG · isolierte Code-Vorschau</title>
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#fff}
iframe{display:block;border:0;width:100%;height:100%;background:#fff}
</style>
</head>
<body>
<iframe id="result" title="Code-Vorschau" sandbox="allow-scripts allow-forms allow-modals allow-pointer-lock" referrerpolicy="no-referrer" credentialless></iframe>
<script>
'use strict';
// This document is served with CSP sandbox allow-scripts and WITHOUT
// allow-same-origin. It has no MAG credentials or access to the parent.
// A nested sandboxed srcdoc inherits this document's deliberately separate
// preview CSP, not MAG's strict application script policy.
const result = document.getElementById('result');
window.addEventListener('message', (event) => {
  if (event.source !== parent || !event.data ||
      event.data.type !== 'mag-preview-render' ||
      typeof event.data.html !== 'string' ||
      event.data.html.length > 1500000) return;
  result.srcdoc = event.data.html;
});
parent.postMessage({ type: 'mag-preview-ready' }, '*');
</script>
</body>
</html>
