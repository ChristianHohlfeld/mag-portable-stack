name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      full:
        description: Run the complete regression suite (otherwise essential CI)
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FULL_CI: ${{ github.event_name == 'workflow_dispatch' && inputs.full && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          packages=(ninja-build ccache jq libssl-dev libcurl4-openssl-dev libarchive-dev libicu-dev)
          mapfile -t room_ocr_packages < ops/install/room-ocr-packages.txt
          packages+=("${room_ocr_packages[@]}")
          if [[ $FULL_CI == true ]]; then packages+=(python3-numpy python3-scipy python3-pil ffmpeg); fi
          sudo apt-get install -y --no-install-recommends "${packages[@]}" || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          }
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Build release targets
        run: |
          source ops/build-targets.sh
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j "$(nproc)" --target "${MAG_BUILD_TARGETS[@]}" mag-stt test-group-dispatcher test-model-text s23ctl
      - name: Native unit tests
        run: |
          ./build/test-group-dispatcher
          ./build/test-model-text
      # The default gate exercises real room requests, not just source assertions.
      # Full regression remains available on demand; no test results are cached.
      - name: Essential room contract
        if: env.FULL_CI != 'true'
        run: |
          python3 mag-room/tests/test_native.py \
            RoomContract.test_unaddressed_message_is_answered_by_all_bots_then_rests \
            RoomContract.test_named_bot_answers_alone \
            RoomContract.test_third_bot_from_existing_roster_routes_by_id_through_audit \
            RoomContract.test_new_builtin_bots_get_distinct_vms \
            RoomContract.test_qwen_vm_migration_enables_tools_and_page_cards \
            RoomContract.test_html_preview_prompt_without_vm \
            RoomContract.test_autonomous_chat_can_start_without_human_or_browser \
            RoomContract.test_autonomous_chat_respects_paused_bot \
            RoomContract.test_autonomous_peer_can_start_while_other_bot_is_working \
            RoomContract.test_due_routines_are_independent_and_wait_for_own_human_task \
            RoomContract.test_prefill_and_tool_only_stream_report_live_progress \
            RoomContract.test_human_reply_overlaps_peer_routine_and_filters_its_context \
            RoomContract.test_human_reply_overlaps_peer_goal_inference \
            RoomContract.test_autonomous_chat_unlimited_continues_past_both_hidden_caps \
            RoomContract.test_stop_cancels_a_running_answer \
            RoomContract.test_mistral_small4_chat_roles_and_effort_without_touching_gemma \
            RoomContract.test_autonomous_work_can_repair_verify_and_finish_in_same_turn \
            RoomContract.test_whois_and_csrf_guard
      - name: Room contract (complete regression)
        if: env.FULL_CI == 'true'
        run: |
          command -v ffmpeg
          command -v ffprobe
          python3 mag-room/tests/run_native_parallel.py
      - name: Publisher HTTP protocol (real ustar uploads; final Content-Length header)
        run: python3 ops/bots/tests/test_publishd_http.py
      - name: Shell syntax
        run: bash ops/ci/check.sh
      - name: Model supervisor
        run: python3 ops/models/tests/test_modeld.py
      - name: Idol priority over Qwen
        run: python3 ops/idol/tests/test_worker.py --gpu-priority
      - name: GPU thermal safety
        run: python3 ops/idol/tests/test_thermal.py
      - name: Idol worker (complete graphics regression)
        if: env.FULL_CI == 'true'
        run: |
          python3 ops/idol/tests/test_worker.py
          python3 ops/idol/tests/test_unwrap.py
          python3 ops/idol/tests/test_surface.py
          python3 ops/idol/tests/test_photo.py
      - name: Reading aloud (text, conversation sequence and playback rates)
        run: |
          node mag-room/tests/test_tts_text.js
          node mag-room/tests/test_read_from_here.js
          node mag-room/tests/test_tts_stall.js
          node mag-room/tests/test_tts_play_duration.js
          node mag-room/tests/test_tts_first_chunk.js
          node mag-room/tests/test_tts_stream_stop.js
          node mag-room/tests/test_tts_whisper.js
      - name: Live browser (gestures, keyboard only from a tap, HTTPS picture)
        run: |
          npm install --prefix /tmp/mag-live-jsdom jsdom@26.1.0 playwright-core@1.56.1
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_chat_header.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules MAG_SKIP_CHROME=1 node mag-room/tests/test_live_view.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_web_ui.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_chip_pointer.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_generation_push.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node --no-warnings mag-room/tests/test_share_target.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_code_editor.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_code_streaming.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_video_voiceover.js
          node mag-room/tests/test_voiceover_contract.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_video_part_retry.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_media_filter.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_media_initial.js
          node mag-room/tests/test_zip_range.js
          node mag-room/tests/test_glb_pinch.js
          node mag-room/tests/test_unlimited_bot_dialogue.js
          node --check mag-room/web/app/messages.js
          node --check mag-room/web/app/tts-worker.js
          node mag-room/tests/test_bot_name_prefix.js
          node mag-room/tests/test_self_profile_placement.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules MAG_SKIP_CHROME=1 node mag-room/tests/test_will_line.js
          node mag-room/tests/test_routine_minutes.js
          node mag-room/tests/test_routine_coalesce.js
          node mag-room/tests/test_browser_body_null.js
          node mag-room/tests/test_screen_awake.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_goal_group.js
      - name: Scenes (complete regression)
        if: env.FULL_CI == 'true'
        run: |
          python3 ops/scene/tests/test_rig.py
          python3 ops/scene/tests/test_motion.py
          python3 ops/scene/tests/test_animal.py
          python3 ops/scene/tests/test_worker.py
      - name: Phone control daemon (not part of a release; the room's phone tools are tested against it)
        run: python3 devices/s23/tests/test_s23ctl.py
  secrets:
    name: No secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
