name: One-shot apply live answer
on:
  push:
    branches: [room/live-answer]
    paths: ['.github/workflows/apply-live-answer.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room/live-answer
      - name: Apply and verify
        run: |
          set -e
          echo '24914666df64074550648cf78a1a417e72fefa981dfa05f22490d939eea50568  .one-shot/0011.diff' | sha256sum -c
          echo 'b4c3f243d093e3cbe56076b281570c823457c585a71d5bbe45e501b874686e11  mag-room/native/magroom.cpp' | sha256sum -c
          echo '1fac7e80c8ab36f1d2a02466643dd070eabe23ddf50cea41a756850d5019ff2e  mag-room/tests/test_native.py' | sha256sum -c
          echo 'a855cdbecc81f58bb1a17f72029f3013a7b406b3142e9275a95f65ef0d3f94a8  mag-room/web/index.html' | sha256sum -c
          git apply --unidiff-zero .one-shot/0011.diff
          printf '%s\n' \
            '44b96895f6ec2efe3e7a7880592457d6b06dab513d336988e2c793ab48d80864  mag-room/native/magroom.cpp' \
            'ef344511623db365bdada450bfee2d401fa5bba283f16faa804ee1cacd49786d  mag-room/tests/test_native.py' \
            '39cd312e17acf6d924551869dd5dbf6591fe30ef79fb8475c1a31958be04f8e0  mag-room/web/index.html' | sha256sum -c
          git rm -q .one-shot/0011.diff
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add mag-room/native/magroom.cpp mag-room/tests/test_native.py mag-room/web/index.html
          git commit -m 'Room: answers stream live while thinking is on, revocable draft for narration, live reply never shrinks'
          git push origin HEAD:room/live-answer
