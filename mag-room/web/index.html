<!doctype html>
<html lang="de">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MAG · Raum</title>
<script src="/static/marked.min.js"></script><script src="/static/purify.min.js"></script><script src="/static/highlight.min.js"></script><link rel="stylesheet" href="/static/github-dark.min.css">
<style>
:root{color-scheme:dark;--bg:#101218;--panel:#181c25;--line:#2c3341;--muted:#98a4b7;--accent:#b8d5ff;font:15px/1.55 system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#eef2f8}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);background:#232b39;border-radius:10px;padding:8px 13px}button:hover{background:#344156}button.primary{background:#b8d5ff;color:#142238}button.danger{color:#ffb3b3}button:disabled{opacity:.5;cursor:wait}input,textarea,select{border:1px solid var(--line);border-radius:10px;background:#10151f;padding:9px}header{height:70px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px}header strong{font-size:21px;letter-spacing:.04em}header small{color:var(--muted)}header .status{margin-left:auto;font-size:13px;color:var(--muted)}.dot{display:inline-block;background:#76dbac;width:8px;height:8px;border-radius:50%;margin-right:7px}.layout{display:grid;grid-template-columns:240px minmax(0,1fr) 340px;height:calc(100dvh - 70px)}aside{padding:20px;border-right:1px solid var(--line);overflow:auto}aside.right{border-right:0;border-left:1px solid var(--line)}h2{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:8px 0 14px}.section{margin-bottom:28px}.agent{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:12px;margin:10px 0}.agent label{display:flex;align-items:center;gap:9px;font-weight:600}.agent small{display:block;color:var(--muted);margin:5px 0}.agent .actions{display:flex;gap:7px}.agent .actions button{font-size:12px;padding:4px 8px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{min-width:0;flex:1}.main{display:flex;flex-direction:column;min-width:0;min-height:0}.conversation{flex:1;overflow:auto;padding:28px clamp(18px,5vw,70px);scroll-behavior:smooth}.empty{max-width:490px;margin:15vh auto;color:var(--muted)}.empty h1{font-size:29px;color:#eef2f8;font-weight:550}.message{margin:0 0 28px;max-width:900px}.message .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;align-items:center;margin-bottom:8px}.message .meta strong{font-size:14px;color:var(--accent)}.message.user{background:var(--panel);padding:16px 20px;border-radius:14px}.content{overflow-wrap:anywhere}.content>:first-child{margin-top:0}.content img{max-width:100%;border-radius:10px}.content pre{overflow:auto;padding:14px;border:1px solid var(--line);border-radius:10px;background:#0c1018;position:relative}.copy{position:absolute;right:5px;top:5px;font-size:11px;padding:3px 7px}.content table{border-collapse:collapse;display:block;overflow:auto}.content th,.content td{padding:8px 12px;border:1px solid var(--line)}a{color:var(--accent)}details{color:var(--muted);font-size:12px}.composer{padding:15px 24px 20px;border-top:1px solid var(--line)}.composer textarea{resize:none;width:100%;min-height:78px;max-height:180px}.composer .row{margin-top:9px}.hint{font-size:12px;color:var(--muted)}.spacer{flex:1}.notice{color:#ffcfa6;font-size:13px;min-height:20px}.file{display:block;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}.file small{color:var(--muted)}#screen{width:100%;border:1px solid var(--line);border-radius:8px;margin-top:10px}#screen.interactive{cursor:crosshair;touch-action:none;user-select:none;-webkit-user-drag:none}#canvas{width:100%;height:320px;background:white;border:1px solid var(--line);border-radius:8px;margin-top:10px}audio{max-width:100%;height:38px}dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;color:inherit;max-width:560px;width:90%;padding:25px}dialog::backdrop{background:#0009}dialog input,dialog textarea{display:block;width:100%;margin:10px 0}#memory{white-space:pre-wrap;max-height:400px;overflow:auto}#activity{font-size:12px;max-height:120px;overflow:auto;color:var(--muted)}.mobile-toggle{display:none}@media(max-width:1150px){.layout{grid-template-columns:210px minmax(0,1fr)}aside.right{display:none}.layout.show-tools{grid-template-columns:minmax(0,1fr) 320px}.show-tools aside.left{display:none}.show-tools aside.right{display:block}.mobile-toggle{display:inline-block}}@media(max-width:650px){header{padding:0 15px;gap:8px}header small{display:none}.layout{grid-template-columns:1fr}.layout aside{display:none}.layout.show-agents{grid-template-columns:220px minmax(0,1fr)}.layout.show-agents aside.left{display:block}.layout.show-tools{grid-template-columns:1fr}.show-tools .main{display:none}.show-tools aside.right{display:block}.composer{padding:12px}.conversation{padding:20px 15px}.hint{display:none}}
</style></head>
<body><header><strong>MAG</strong><small>Ein Raum. Eigene Welten.</small><button class="mobile-toggle" id="toggle-agents">Bots</button><button class="mobile-toggle" id="toggle-tools">Werkzeuge</button><span class="status" id="connection"><span class="dot"></span>Verbinde…</span></header>
<div class="layout" id="layout"><aside class="left"><div class="section"><h2>Im Raum</h2><div id="agents"></div><button id="add-agent">+ Bot hinzufügen</button></div><div class="section"><h2>Zusammenarbeit</h2><label><input type="checkbox" id="autotalk"> Autonom arbeiten</label><p class="hint">Läuft auch, wenn du den Browser schließt.</p><label><input type="checkbox" id="web" checked> Websuche</label><p><button class="danger" id="stop">Alle pausieren</button></p></div><div class="section"><h2>Einstellungen</h2><label><input type="checkbox" id="tts"> Antworten vorlesen</label><p><select id="language"><option value="auto">Sprache automatisch</option><option value="de">Deutsch</option><option value="en">English</option></select></p><button id="reset">Raum leeren</button><p class="hint">Entfernt Nachrichten und Raumdateien. Die Erinnerungen der Bots bleiben.</p></div></aside>
<main class="main"><div class="conversation" id="conversation"></div><div class="composer"><div class="notice" id="notice" role="status"></div><form id="send-form"><textarea id="message" placeholder="Sprich mit den Bots oder gib ihnen eine Aufgabe…" aria-label="Nachricht"></textarea><div class="row"><button type="button" id="upload">Datei</button><button type="button" id="mic">Mikrofon</button><span class="hint">Enter senden · Shift+Enter neue Zeile</span><span class="spacer"></span><button class="primary" type="submit">Senden</button></div></form><input id="file-input" type="file" multiple hidden></div></main>
<aside class="right"><div class="section"><h2>Browser</h2><select id="browser-agent" aria-label="Browser auswählen"></select><div class="row" style="margin-top:10px"><input id="browser-url" placeholder="https://…"><button id="browser-open">Öffnen</button></div><p><label><input id="live" type="checkbox"> Bildschirm anzeigen</label></p><img id="screen" alt="Browser des ausgewählten Bots" hidden><div class="row"><input id="browser-selector" placeholder="CSS-Selektor oder sichtbarer Text"><button id="browser-click">Klick</button></div><div class="row" style="margin-top:8px"><input id="browser-text" placeholder="Text eingeben"><button id="browser-type">Tippen</button></div><div class="row" style="margin-top:8px"><button id="browser-back">Zurück</button><button id="browser-scroll">Scrollen</button><button id="browser-read">Seite lesen</button></div></div><div class="section"><h2>Gemeinsame Dateien</h2><div id="files"></div><iframe id="canvas" title="Gemeinsame Vorschau" sandbox="allow-scripts" hidden></iframe></div><div class="section"><h2>Aktivität</h2><div id="activity"></div></div></aside></div>
<dialog id="new-agent"><form id="agent-form"><h3>Ein neuer Entdecker</h3><input id="agent-name" required maxlength="40" placeholder="Name"><textarea id="agent-persona" placeholder="Persönlichkeit und Interessen"></textarea><div class="row"><button type="button" onclick="document.getElementById('new-agent').close()">Abbrechen</button><button class="primary">Bot erstellen</button></div></form></dialog><dialog id="memory-dialog"><h3 id="memory-title"></h3><div id="memory"></div><p><button onclick="document.getElementById('memory-dialog').close()">Schließen</button></p></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id);let state={agents:[],room:[],files:[]},streams={},selected=new Set(),recorder=null,chunks=[],screenBusy=false,rendered=false,refreshSeq=0;
function notice(t=''){$('notice').textContent=t}function activity(t){const e=document.createElement('div');e.textContent=new Date().toLocaleTimeString()+' · '+t;$('activity').prepend(e);while($('activity').children.length>20)$('activity').lastChild.remove()}
async function api(path,body,method='POST'){const options={method};if(body!==undefined){options.body=typeof body==='string'?body:JSON.stringify(body);options.headers={'Content-Type':'application/json'}}const r=await fetch(path,options);const text=await r.text();let data;try{data=JSON.parse(text)}catch{data={error:text}}if(!r.ok)throw Error(data.error||r.statusText);return data}
function safeMarkdown(t){return DOMPurify.sanitize(marked.parse(t||'',{breaks:true}))}function decorate(el){el.querySelectorAll('pre code').forEach(c=>{hljs.highlightElement(c);const b=document.createElement('button');b.textContent='Kopieren';b.className='copy';b.onclick=()=>navigator.clipboard.writeText(c.textContent);c.parentNode.appendChild(b)});el.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'})}
function append(msg,scroll=true){const area=$('conversation');area.querySelector('.empty')?.remove();const div=document.createElement('article');div.className='message '+(msg.role==='user'?'user':'');div.dataset.id=msg.id||'';const meta=document.createElement('div');meta.className='meta';const name=document.createElement('strong');name.textContent=msg.name||'Bot';const time=document.createElement('span');time.textContent=new Date((msg.ts||Date.now()/1000)*1000).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});meta.append(name,time);div.append(meta);const content=document.createElement('div');content.className='content';content.innerHTML=safeMarkdown(msg.content);decorate(content);div.append(content);if(msg.file){const f=msg.file;const a=document.createElement('a');a.href='/api/file/'+encodeURIComponent(f.stored);a.textContent=f.name;div.append(a);if(f.mime?.startsWith('audio/')){const audio=document.createElement('audio');audio.controls=true;audio.src=a.href;div.append(audio)}if(f.mime?.startsWith('image/')){const image=document.createElement('img');image.src=a.href;image.alt=f.name;content.append(image)}}area.append(div);if(scroll)area.scrollTop=area.scrollHeight;return div}
function render(){const area=$('conversation');const bottom=!rendered||area.scrollHeight-area.scrollTop-area.clientHeight<130;const oldScroll=area.scrollTop;rendered=true;area.replaceChildren();if(!state.room.length)area.innerHTML='<div class="empty"><h1>Was entdecken wir heute?</h1><p>Jeder Bot hat seine eigene VM, einen eigenen Browser und bleibende Erinnerungen. Dateien und Ideen teilt ihr hier.</p></div>';state.room.forEach(m=>append(m,false));for(const s of Object.values(streams)){s.node=append({role:'assistant',name:s.name,content:s.text},false)}if(!bottom)area.scrollTop=oldScroll;if(bottom)area.scrollTop=area.scrollHeight;renderAgents();renderFiles();$('autotalk').checked=!!state.autotalk;}
function renderAgents(){const list=$('agents');list.replaceChildren();const old=$('browser-agent').value;$('browser-agent').replaceChildren();for(const a of state.agents){if(!selected.has(a.id)&&!sessionStorage.getItem('mag-selected'))selected.add(a.id);const card=document.createElement('div');card.className='agent';const label=document.createElement('label');const check=document.createElement('input');check.type='checkbox';check.checked=selected.has(a.id);check.onchange=()=>{check.checked?selected.add(a.id):selected.delete(a.id);sessionStorage.setItem('mag-selected',JSON.stringify([...selected]))};const name=document.createElement('span');name.textContent=a.name;name.style.color=a.color;label.append(check,name);const info=document.createElement('small');info.textContent=a.vm+' · '+(a.memory_count||0)+' Erinnerungen';const actions=document.createElement('div');actions.className='actions';for(const [title,fn] of [['Erinnerung',()=>memory(a)],['Entfernen',()=>removeAgent(a)]]){const b=document.createElement('button');b.textContent=title;b.onclick=fn;actions.append(b)}card.append(label,info,actions);list.append(card);const option=document.createElement('option');option.value=a.id;option.textContent=a.name;$('browser-agent').append(option)}if(state.agents.some(a=>a.id===old))$('browser-agent').value=old;}
function renderFiles(){const list=$('files');list.replaceChildren();for(const f of state.files){const row=document.createElement('div');row.className='file';const a=document.createElement('a');a.href='/api/file/'+encodeURIComponent(f.stored);a.textContent=f.name;row.append(a);const size=document.createElement('small');size.textContent=' · '+Math.ceil(f.size/1024)+' KB';row.append(size);if(f.mime==='text/html'){const b=document.createElement('button');b.textContent='Vorschau';b.onclick=async()=>{try{$('canvas').srcdoc=await(await fetch(a.href)).text();$('canvas').hidden=false}catch(e){notice(e.message)}};row.append(b)}list.append(row)}}
async function refresh(){const seq=++refreshSeq;const r=await fetch('/api/state');if(!r.ok)throw Error('Raum nicht erreichbar');const next=await r.json();if(seq!==refreshSeq)return;state=next;render()}
async function memory(a){try{const m=await api('/api/agents/'+a.id+'/memory',undefined,'GET');$('memory-title').textContent=a.name+' · Erinnerungen';$('memory').textContent=m.map(x=>'• '+(x.text||x)).join('\n\n')||'Noch keine gespeicherten Erinnerungen.';$('memory-dialog').showModal()}catch(e){notice(e.message)}}
async function removeAgent(a){if(!confirm(a.name+' und die eigene VM mit ihren Dateien entfernen?'))return;try{notice('Bot wird entfernt…');await api('/api/agents/'+a.id,undefined,'DELETE');await refresh();notice()}catch(e){notice(e.message)}}
$('add-agent').onclick=()=>$('new-agent').showModal();$('agent-form').onsubmit=async e=>{e.preventDefault();const submit=e.target.querySelector('.primary');submit.disabled=true;try{notice('Eigene VM wird vorbereitet…');await api('/api/agents',{name:$('agent-name').value,persona:$('agent-persona').value});$('new-agent').close();await refresh();notice()}catch(e){notice(e.message)}finally{submit.disabled=false}};
$('send-form').onsubmit=async e=>{e.preventDefault();const text=$('message').value.trim();if(!text)return;try{await api('/api/message',{text,bots:[...selected],web_search:$('web').checked});$('message').value='';notice()}catch(e){notice(e.message)}};$('message').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('send-form').requestSubmit()}};
$('autotalk').onchange=async()=>{try{await api('/api/autotalk',{on:$('autotalk').checked});notice()}catch(e){notice(e.message);await refresh()}};$('stop').onclick=async()=>{try{await api('/api/stop',{});$('autotalk').checked=false;activity('Alle Bots pausiert')}catch(e){notice(e.message)}};
$('reset').onclick=async()=>{if(!confirm('Nachrichten, Raumdateien und veröffentlichte Oberfläche entfernen? Bot-Erinnerungen bleiben erhalten.'))return;try{await api('/api/reset',{});streams={};await refresh()}catch(e){notice(e.message)}};
$('upload').onclick=()=>$('file-input').click();$('file-input').onchange=async()=>{for(const file of $('file-input').files){try{notice('Lade '+file.name+'…');const r=await fetch('/api/upload?name='+encodeURIComponent(file.name),{method:'POST',body:file});if(!r.ok)throw Error((await r.json()).error);await refresh();notice()}catch(e){notice(e.message)}}$('file-input').value=''};
for(const id of ['web','tts','language','live']){const stored=localStorage.getItem('mag-'+id);if(stored!==null){if($(id).type==='checkbox')$(id).checked=stored==='true';else $(id).value=stored}$(id).addEventListener('change',()=>localStorage.setItem('mag-'+id,$(id).type==='checkbox'?$(id).checked:$(id).value))}try{selected=new Set(JSON.parse(sessionStorage.getItem('mag-selected')||'[]'))}catch{}
async function browser(action,body={}){const id=$('browser-agent').value;if(!id)throw Error('Bot auswählen');return api('/api/browser/'+encodeURIComponent(id)+'/'+action,body)}
$('browser-open').onclick=async()=>{try{await browser('navigate',{url:$('browser-url').value});notice()}catch(e){notice(e.message)}};$('browser-click').onclick=async()=>{try{const v=$('browser-selector').value;await browser('click',v.startsWith('text=')?{text:v.slice(5)}:{selector:v});notice()}catch(e){notice(e.message)}};$('browser-type').onclick=async()=>{try{await browser('type',{text:$('browser-text').value});notice()}catch(e){notice(e.message)}};for(const action of ['back','scroll','read'])$('browser-'+action).onclick=async()=>{try{const r=await browser(action,{dy:600});if(action==='read'){$('memory-title').textContent=r.title;$('memory').textContent=r.text;$('memory-dialog').showModal()}}catch(e){notice(e.message)}};
async function screen(){if(!$('live').checked||screenBusy||!$('browser-agent').value)return;screenBusy=true;try{const r=await fetch('/api/screen/'+$('browser-agent').value);if(!r.ok)throw Error((await r.json()).error);const old=$('screen').src;$('screen').src=URL.createObjectURL(await r.blob());$('screen').hidden=false;if(old.startsWith('blob:'))URL.revokeObjectURL(old)}catch(e){activity(e.message)}finally{screenBusy=false}}setInterval(()=>{if(document.visibilityState==='visible')screen()},500);
$('live').addEventListener('change',()=>{$('screen').hidden=!$('live').checked;$('screen').classList.toggle('interactive',$('live').checked);
$('screen').tabIndex=0;$('screen').title='Bot-Browser direkt bedienen: Klicken, Ziehen, Scrollen oder fokussieren und tippen';screen()});
$('screen').classList.toggle('interactive',$('live').checked);
// Direct control works in Chromium viewport coordinates, never host pixels.
// Events are serialized: down -> move -> up cannot overtake one another.
let pointerChain=Promise.resolve(),pendingMove=false,activePointer=null;
function viewportPoint(e){
 const img=$('screen'),rect=img.getBoundingClientRect();
 if(!rect.width||!rect.height||!img.naturalWidth||!img.naturalHeight)return null;
 const x=Math.max(0,Math.min(img.naturalWidth,(e.clientX-rect.left)*img.naturalWidth/rect.width));
 const y=Math.max(0,Math.min(img.naturalHeight,(e.clientY-rect.top)*img.naturalHeight/rect.height));
 return {x,y};
}
function pointerAction(action,point,extra={}){
 if(!point||!$('live').checked||!$('browser-agent').value)return;
 if(action==='move'&&pendingMove)return; // coalesce motion under load
 if(action==='move')pendingMove=true;
 const id=$('browser-agent').value;
 pointerChain=pointerChain.catch(()=>{}).then(async()=>{
   await api('/api/browser/'+encodeURIComponent(id)+'/pointer',{action,...point,...extra});
 }).catch(e=>notice('Browsersteuerung: '+e.message)).finally(()=>{
   if(action==='move')pendingMove=false;
   if(action==='up'||action==='click')setTimeout(screen,100);
 });
}
function mouseButton(e){return e.button===2?'right':e.button===1?'middle':'left'}
$('screen').addEventListener('pointerdown',e=>{
 if(!$('live').checked)return;
 e.preventDefault();e.currentTarget.focus({preventScroll:true});activePointer=e.pointerId;
 try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}
 pointerAction('down',viewportPoint(e),{button:mouseButton(e)});
});
$('screen').addEventListener('pointermove',e=>{
 if(!$('live').checked)return;
 if(activePointer!==null&&activePointer!==e.pointerId)return;
 pointerAction('move',viewportPoint(e),{button:mouseButton(e)});
});
function releasePointer(e){
 if(activePointer!==e.pointerId)return;
 e.preventDefault();activePointer=null;
 pointerAction('up',viewportPoint(e),{button:mouseButton(e)});
}
$('screen').addEventListener('pointerup',releasePointer);
$('screen').addEventListener('pointercancel',releasePointer);
$('screen').addEventListener('contextmenu',e=>{if($('live').checked)e.preventDefault()});
$('screen').addEventListener('wheel',e=>{
 if(!$('live').checked)return;
 e.preventDefault();
 const dy=Math.max(-1200,Math.min(1200,e.deltaY));
 const dx=Math.max(-1200,Math.min(1200,e.deltaX));
 pointerAction('wheel',viewportPoint(e),{deltaX:dx,deltaY:dy});
},{passive:false});
$('screen').addEventListener('keydown',e=>{
 if(!$('live').checked)return;
 // Keep shortcuts scoped to the focused preview, not to the MAG room.
 e.preventDefault();
 const id=$('browser-agent').value;if(!id)return;
 const details={key:e.key,code:e.code,shift:e.shiftKey,
                ctrl:e.ctrlKey,alt:e.altKey,meta:e.metaKey};
 pointerChain=pointerChain.catch(()=>{}).then(()=>
   api('/api/browser/'+encodeURIComponent(id)+'/key',details)
 ).catch(err=>notice('Tastatur: '+err.message));
});

$('mic').onclick=async()=>{if(recorder?.state==='recording'){recorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$('mic').textContent='Mikrofon';notice('Transkribiere lokal…');try{const r=await fetch('/api/stt?lang='+$('language').value,{method:'POST',body:new Blob(chunks,{type:recorder.mimeType})});const result=await r.json();if(!r.ok)throw Error(result.error);$('message').value=result.corrected||result.text;notice(result.correction_pending?'Text erkannt; Kontextkorrektur war ausgelastet.':'Text bereit — prüfe ihn vor dem Senden.')}catch(e){notice(e.message)}};recorder.start();$('mic').textContent='Aufnahme stoppen';notice('Aufnahme läuft…')}catch(e){notice('Mikrofon: '+e.message)}};
$('toggle-agents').onclick=()=>$('layout').classList.toggle('show-agents');$('toggle-tools').onclick=()=>$('layout').classList.toggle('show-tools');
const events=new EventSource('/api/events');events.onopen=()=>{$('connection').innerHTML='<span class="dot"></span>Verbunden';refresh().catch(e=>notice(e.message))};events.onerror=()=>{$('connection').textContent='Verbindung wird erneuert…'};events.onmessage=e=>{try{const event=JSON.parse(e.data);if(event.type==='bot_start'){streams[event.bot]={text:'',name:event.name,node:append({role:'assistant',name:event.name,content:''})};activity(event.name+' arbeitet')}else if(event.type==='delta'){const s=streams[event.bot];if(s){s.text+=event.text;s.node.querySelector('.content').textContent=s.text;const area=$('conversation');if(area.scrollHeight-area.scrollTop-area.clientHeight<200)area.scrollTop=area.scrollHeight}}else if(event.type==='reasoning'){activity('Denkt nach…')}else if(['bot_done','message','file','agents','reset','idle'].includes(event.type)){if(event.type==='bot_done')delete streams[event.bot];if(event.type==='bot_done'&&$('tts').checked&&event.content&&'speechSynthesis'in window){const u=new SpeechSynthesisUtterance(event.content);u.lang=$('language').value==='en'?'en-US':'de-DE';speechSynthesis.speak(u)}refresh().catch(e=>notice(e.message))}else if(event.type==='autotalk')$('autotalk').checked=event.on;else if(event.type==='error'){notice(event.text);activity(event.text)}else if(event.type==='frontend')location.reload();else if(event.type==='tool')activity(event.name||event.text||'Werkzeug');else if(event.type==='stopped'||event.type==='cancelled'){streams={};activity('Pausiert');refresh()}}catch(err){notice(err.message)}};
refresh().catch(e=>notice(e.message));
</script></body></html>
