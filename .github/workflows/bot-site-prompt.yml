name: gate bot site prompt
on:
  push:
    branches: [cursor/bot-subdomains-fe15]
    paths: ['.github/workflows/bot-site-prompt.yml']
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gate the site prompt and build the publisher with the room
        run: |
          python3 ops/bots/apply-site-gate.py
          git rm -f ops/bots/publishd.py ops/bots/apply-site-gate.py .github/workflows/bot-site-prompt.yml
          git config user.email 'cursor@users.noreply.github.com'
          git config user.name 'Cursor Agent'
          git add ops/update.sh ops/bootstrap.sh ops/deploy.sh mag-room/native/magroom.cpp
          git commit -m "Gate the bot site prompt and build the native publisher"
          git push origin HEAD:cursor/bot-subdomains-fe15
