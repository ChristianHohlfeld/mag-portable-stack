name: Green main (GitHub only)
# Public GitHub standard runners are free; MAG polls GitHub green.
# No Gitea statuses or Gitea Actions can promote or deploy a release.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Slow e2e checks may outlive the first push gate. A single scheduled
  # recheck avoids workflow_run storms / startup_failure and never promotes
  # until EVERY main-push release workflow succeeded for this exact SHA.
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  actions: read
concurrency:
  group: github-green-main
  cancel-in-progress: true
jobs:
  promote-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0
      - name: Bounded deployment-script checks
        timeout-minutes: 5
        run: |
          set -euo pipefail
          bash -n ops/update.sh ops/auto-update/auto-update.sh ops/ci/fetch-github-green.sh ops/ci/promote-github.sh
          git diff --check HEAD^ HEAD
          grep -Fq 'fetch-github-green.sh' ops/update.sh
          grep -Fq 'fetch-github-green.sh' ops/auto-update/auto-update.sh
      # Keep green as the last fully tested main, not merely shell-syntax-clean.
      # The independent workflows all run on pushes to main. Fail closed if
      # any is missing, pending past deadline, cancelled or failed.
      - id: gate
        name: Require all release workflows to succeed
        uses: actions/github-script@v7
        timeout-minutes: 16
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const required = [
              'Native MAG stack',
              'Room agent-chat contract (Stop, priority, queue, browser)',
              'Screenshot paste browser emulation',
              'Blank-host bootstrap (e2e)',
              'MAG encrypted backup and restore',
              'Private nginx cutover security',
              'MAG Pages native C++ / nginx / secrets',
              'MAG German browser speech',
            ];
            const { owner, repo } = context.repo;
            // Scheduled runs use the latest default branch SHA. Verify all
            // tests belong to this SHA, never an older passing release.
            const scheduled = context.eventName === 'schedule';
            const deadline = Date.now() + 14 * 60_000;
            while (Date.now() < deadline) {
              // Only the same main push is relevant; a passing unrelated PR or
              // historic main run must never authorize a release.
              const result = await github.rest.actions.listWorkflowRunsForRepo({
                owner, repo, head_sha: context.sha, event: 'push', per_page: 100,
              });
              const runs = result.data.workflow_runs.filter(r =>
                r.head_sha === context.sha &&
                r.head_branch === 'main' &&
                r.event === 'push');
              const pending = [];
              for (const name of required) {
                const match = runs.filter(r => r.name === name)
                  .sort((a,b) => b.id-a.id)[0];
                if (!match || match.status !== 'completed') {
                  pending.push(name);
                } else if (match.conclusion !== 'success') {
                  const reason = name + ' = ' + match.conclusion +
                    '; retaining previous GitHub green';
                  core.warning(reason);
                  core.setOutput('approved', 'false');
                  return;
                }
              }
              if (!pending.length) {
                core.info('All release workflows succeeded on main ' + context.sha);
                core.setOutput('approved', 'true');
                return;
              }
              core.info('Waiting on: ' + pending.join('; '));
              // The schedule retries later; do not burn 14 minutes of runner
              // time every five minutes for an unfinished bootstrap.
              if (scheduled) {
                core.setOutput('approved', 'false');
                return;
              }
              await new Promise(resolve => setTimeout(resolve, 15000));
            }
            core.setFailed('Timed out waiting for release workflows; green unchanged');
      - id: promote
        name: Promote GitHub green
        if: steps.gate.outputs.approved == 'true'
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ops/ci/promote-github.sh
