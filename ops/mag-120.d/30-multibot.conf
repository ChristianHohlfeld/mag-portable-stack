# Ein globaler Gruppenchat fuer alle Bots. Hebt die Einzelbot-Sperre aus
# 20-deepseek-audit.conf auf: gespeicherte (geparkte) Bots erscheinen wieder.
# Jeder Bot behaelt seine eigene VM; Anlegen/Entfernen laeuft ueber den
# bestehenden spawn/despawn-Pfad. Das Modell (Q4 oder IQ3) waehlt jeder Bot
# selbst. Das aendert nur das Modell-Feld der Anfrage: mag-llm und
# mag-llm-iq3 bleiben dauerhaft im RAM und werden nie gestoppt oder neu gestartet.
# Rueckgaengig: Datei entfernen, daemon-reload, nur mag-120 neu starten.
[Service]
Environment=MAG_ROOM_SINGLE_BOT=
