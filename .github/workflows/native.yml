name: Native MAG stack
permissions:
  contents: read
  pull-requests: read
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'mag-room/**'
      - 'CMakeLists.txt'
      - 'mag_deterministic_engine.cpp'
      - 'test_mag_deterministic_engine.py'
      - 'ops/**'
      - 'devices/**'
      - '.github/workflows/native.yml'
      - '.github/workflows/backup.yml'
      - '.gitea/workflows/mag-ci.yml'
jobs:
  fast:
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: Test and workflow deadlines
        timeout-minutes: 15
        run: python3 ops/ci/check-timeouts.py
      - name: Tailscale API nft IPv4/v6 egress regression without modifying host firewall
        timeout-minutes: 10
        if: runner.environment == 'github-hosted'
        run: sudo bash ops/audit/tests/test-tail-egress.sh
      - name: Independent fast contracts
        timeout-minutes: 15
        run: bash ops/ci/run-parallel.sh --jobs 4 --timeout 180 < ops/ci/native-fast.list
  gitleaks:
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          fetch-depth: 0  # Gitleaks PR-commit range needs complete git history
      - name: Gitleaks (no secrets)
        timeout-minutes: 10
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  build:
    timeout-minutes: 25
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: ccache
        timeout-minutes: 10
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-native-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-native-
      - name: Install build dependencies
        timeout-minutes: 10
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y ninja-build ccache libssl-dev libcurl4-openssl-dev libarchive-dev
      - name: Build
        timeout-minutes: 20
        run: |
          launch=()
          if command -v ccache >/dev/null; then
            export CCACHE_DIR="${CCACHE_DIR:-$HOME/.cache/ccache}"
            mkdir -p "$CCACHE_DIR"
            launch+=(-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache)
            ccache --zero-stats || true
          fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${launch[@]}"
          cmake --build build -j 4
          command -v ccache >/dev/null && ccache --show-stats || true
      - uses: actions/upload-artifact@v4
        timeout-minutes: 10
        with:
          name: native-binaries
          retention-days: 1
          if-no-files-found: error
          path: |
            build/magroom
            build/mag-audit-gateway
            build/mag-numa-swap
            build/s23ctl
            build/test-pho-codec
            build/test-guest-pty
            build/test-browser-recovery
            build/test-jobs-mcp
            build/test-pages-native
            build/test-browser-events
            build/test-guest-description
            build/test-guest-curl
            build/test-large-stdin
            build/test-gitea-account
  bins:
    timeout-minutes: 15
    needs: build
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: native-binaries
          path: build
      - name: Native C++ binaries
        timeout-minutes: 15
        run: |
          chmod +x build/test-*
          bash ops/ci/run-parallel.sh --jobs 4 --timeout 90 < ops/ci/native-bins.list
  room:
    timeout-minutes: 20
    needs: build
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: native-binaries
          path: build
      - name: Native room integration
        timeout-minutes: 15
        run: |
          chmod +x build/magroom build/mag-audit-gateway build/mag-numa-swap
          # Contiguous shards share one magroom per slice and run together.
          # Each test is alarm-capped at 30s.
          jobs=$(nproc)
          python3 ops/ci/run-native-suite.py --emit-shards --jobs "$jobs" --file mag-room/tests/test_native.py \
            | bash ops/ci/run-parallel.sh --jobs "$jobs" --timeout 30
  rest:
    timeout-minutes: 20
    needs: build
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/download-artifact@v4
        timeout-minutes: 10
        with:
          name: native-binaries
          path: build
      - name: Native companion checks
        timeout-minutes: 15
        run: |
          chmod +x build/magroom build/mag-audit-gateway build/mag-numa-swap build/s23ctl
          bash ops/ci/run-parallel.sh --jobs 4 --timeout 240 < ops/ci/native-rest.list
  webrtc:
    timeout-minutes: 15
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - uses: actions/setup-go@v5
        timeout-minutes: 5
        with:
          go-version: '1.23'
      - name: Browser WebRTC UDP gateway
        timeout-minutes: 10
        run: cd mag-room/webrtc && go test -mod=mod -timeout 60s ./... && go build -mod=mod -o /tmp/mag-browser-webrtc .
  nginx-syntax:
    timeout-minutes: 25
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: nginx syntax without a real Tailnet listener
        timeout-minutes: 10
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update && sudo apt-get install -y nginx
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout /tmp/mag-ci.key -out /tmp/mag-ci.crt -subj '/CN=mag.stardenburg.de' 2>/dev/null
          sed -e 's|/etc/mag-nginx/tls/cert.pem|/tmp/mag-ci.crt|' -e 's|/etc/mag-nginx/tls/key.pem|/tmp/mag-ci.key|' -e 's|127.0.0.1:4443 ssl http2 proxy_protocol|127.0.0.1:18443 ssl http2|' -e "s|/etc/nginx/snippets/mag-tailnet-ok.inc|$PWD/ops/nginx/mag-tailnet-ok.inc|" ops/private-access/mag-room.nginx.conf > /tmp/mag-ci-site.conf
          grep -Fq 'listen 127.0.0.1:18443 ssl http2;' /tmp/mag-ci-site.conf
          printf 'pid /tmp/mag-ci-nginx.pid;\nerror_log /tmp/mag-ci-nginx.err;\nevents {}\nhttp { access_log off; include /tmp/mag-ci-site.conf; }\n' > /tmp/mag-ci-nginx.conf
          sudo nginx -t -c /tmp/mag-ci-nginx.conf -p /tmp
          python3 ops/tailscale/tests/test-sni-map.py
      - name: Shell syntax
        timeout-minutes: 10
        run: |
          if ! command -v nginx >/dev/null; then sudo apt-get update && sudo apt-get install -y nginx; fi
          bash -n ops/*.sh ops/magbot-guest-run ops/magbot-agent-ctl
          bash -n ops/bots/*.sh ops/bots/tests/*.sh
          bash ops/bots/tests/test-bots.sh
