name: One-shot apply dp-auto-bind
on:
  push:
    branches: [room/dp-auto-bind]
    paths: ['.github/workflows/apply-dp-auto-bind.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room/dp-auto-bind
      - name: Apply diff and verify
        run: |
          set -e
          cat > /tmp/before <<'HASHES'
          dfe58c58a14aa364680693bdec0d5a5e4ad2158c0857bfed54fac32e680c1e51  mag-room/native/magroom.cpp
          62fff584f22b29c1c33b8d738825bfd1618f08ad632c9ce37d6ce0aea2d39bd9  mag-room/native/mcp_routes.hpp
          a4d1f9c3241a28c9967b19ac3cd1ad12ae817d1f76605a340b58e1cd51f25694  mag-room/native/routes.hpp
          d5da8dba5337e18f93955a45b3c4b627e5f6437dcec560ed1b35e73c92a72215  mag-room/tests/test_native.py
          HASHES
          cat > /tmp/after <<'HASHES'
          40d07cdaac68f518e8a2bd431ca6642ea7cd4e82a6bec60ca4a90ddf40e07a32  mag-room/native/magroom.cpp
          e4afbd8fe76c2c1972bb79f7bc3c5c86b74c8a575c6f4018092cf755c670c866  mag-room/native/mcp_routes.hpp
          fcfa9c097c9b83f18562fa737b5901c58044e7abb6aa095df4955f03d511bb1d  mag-room/native/routes.hpp
          d62a424df4b297dcf911ae47dab4e7764d3e970a419cafc762b9b8438a61b277  mag-room/tests/test_native.py
          HASHES
          sed -i 's/^ *//' /tmp/before /tmp/after
          sha256sum -c /tmp/before
          git apply --unidiff-zero .one-shot/0016.diff
          sha256sum -c /tmp/after
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add mag-room/native mag-room/tests/test_native.py
          git commit -m 'Room: Digitalisierungsplanung auto-binds to every bot so chat-only bots can share a public process link'
          git push origin HEAD:room/dp-auto-bind
