# Sandbox for the room process. The room starts its VM helpers through sudo
# (/etc/sudoers.d/magbot-guest) and those children inherit this namespace.
# Therefore NoNewPrivileges=, RestrictSUIDSGID= and ProtectSystem=strict are
# deliberately NOT set here: each would make sudo fail or make the root
# helpers unable to write libvirt overlays, Gitea or /etc state. The helpers
# themselves are the privilege boundary (narrow sudoers, fixed argv).
[Service]
ProtectSystem=full
ProtectHome=true
PrivateTmp=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectKernelLogs=true
ProtectControlGroups=true
ProtectClock=true
ProtectHostname=true
LockPersonality=true
RestrictRealtime=true
RestrictNamespaces=true
SystemCallArchitectures=native
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
