name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache jq libssl-dev libcurl4-openssl-dev libarchive-dev libicu-dev python3-numpy python3-scipy python3-pil ffmpeg
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Build release targets
        run: |
          source ops/build-targets.sh
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j "$(nproc)" --target "${MAG_BUILD_TARGETS[@]}" mag-stt test-group-dispatcher test-model-text s23ctl
      - name: Publisher HTTP protocol (real ustar uploads; final Content-Length header)
        run: python3 ops/bots/tests/test_publishd_http.py
      - name: Shell syntax
        run: bash ops/ci/check.sh
      - name: Model supervisor
        run: python3 ops/models/tests/test_modeld.py
      - name: Idol worker (jobs survive restarts, a cut-off photo is refused in words, every model gets its UVs)
        run: |
          python3 ops/idol/tests/test_thermal.py
          python3 ops/idol/tests/test_worker.py
          python3 ops/idol/tests/test_unwrap.py
          python3 ops/idol/tests/test_surface.py
          python3 ops/idol/tests/test_photo.py
      - name: Reading aloud (text, conversation sequence and playback rates)
        run: |
          node mag-room/tests/test_tts_text.js
          node mag-room/tests/test_read_from_here.js
          node mag-room/tests/test_tts_stall.js
          node mag-room/tests/test_tts_play_duration.js
          node mag-room/tests/test_tts_stream_stop.js
      - name: Live browser (gestures, keyboard only from a tap, HTTPS picture)
        run: |
          npm install --prefix /tmp/mag-live-jsdom jsdom@26.1.0
          NODE_PATH=/tmp/mag-live-jsdom/node_modules MAG_SKIP_CHROME=1 node mag-room/tests/test_live_view.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_web_ui.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_chip_pointer.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_generation_push.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_code_editor.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_code_streaming.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_video_voiceover.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_video_part_retry.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_media_filter.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_media_initial.js
          node mag-room/tests/test_zip_range.js
          node mag-room/tests/test_glb_pinch.js
          node mag-room/tests/test_routine_minutes.js
          node mag-room/tests/test_routine_coalesce.js
          node mag-room/tests/test_browser_body_null.js
          node mag-room/tests/test_screen_awake.js
          NODE_PATH=/tmp/mag-live-jsdom/node_modules node mag-room/tests/test_goal_group.js
      - name: Scenes (figures get the right skeleton; films survive restarts)
        run: |
          python3 ops/scene/tests/test_rig.py
          python3 ops/scene/tests/test_motion.py
          python3 ops/scene/tests/test_animal.py
          python3 ops/scene/tests/test_worker.py
      - name: Phone control daemon (not part of a release; the room's phone tools are tested against it)
        run: python3 devices/s23/tests/test_s23ctl.py
      - name: Room regression (VM reset + unattended tool retry)
        run: |
          python3 mag-room/tests/test_native.py RoomContract.test_a_bot_is_reset_to_its_first_day_whatever_state_it_is_in RoomContract.test_autonomous_tool_call_cannot_end_dialogue_or_run_tool
      - name: Room contract (fake models, fake guest)
        run: |
          command -v ffmpeg
          command -v ffprobe
          ./build/test-group-dispatcher
          ./build/test-model-text
          python3 mag-room/tests/test_native.py
  secrets:
    name: No secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
