name: One-shot apply compact-chrome
on:
  push:
    branches: [room/compact-chrome]
    paths: ['.github/workflows/apply-compact-chrome.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room/compact-chrome
      - name: Apply diff and verify
        run: |
          set -e
          echo 'b1c2b15b7f7803a1da8ffaf2c05a0ac420dcc70c58b824e9f14600e4d14aff78  mag-room/web/index.html' > /tmp/before
          echo '4fe5ec15ac6436ff20ce0ee75d025786e79593b17962a3a34fe37dcfd8fe0d6f  mag-room/web/index.html' > /tmp/after
          sha256sum -c /tmp/before
          git apply --unidiff-zero .one-shot/0014.diff
          sha256sum -c /tmp/after
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add mag-room/web/index.html
          git commit -m 'Room: slimmer header (48px) and composer (42px), more room for the conversation on phone and desktop'
          git push origin HEAD:room/compact-chrome
