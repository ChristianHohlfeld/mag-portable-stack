name: Deploy MAG
# Runs on the self-hosted runner on MAG after CI on main is green. It only
# writes the deploy request; the host then runs the normal auto-update
# (fast-forward main, build, deploy.sh with backup and automatic rollback).
# Inactive until the repository variable MAG_SELF_HOSTED is set to "on".
on:
  workflow_run:
    workflows: ["Native MAG stack"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-mag
  cancel-in-progress: false
jobs:
  deploy:
    if: vars.MAG_SELF_HOSTED == 'on' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, mag]
    timeout-minutes: 5
    steps:
      - name: Request deploy
        run: date -u +%FT%TZ > /var/lib/mag-deploy/request
