name: One-shot apply tool-trace
on:
  push:
    branches: [room/tool-trace]
    paths: ['.github/workflows/apply-tool-trace.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room/tool-trace
      - name: Apply diff and verify
        run: |
          set -e
          cat > /tmp/before <<'SUM'
          44b96895f6ec2efe3e7a7880592457d6b06dab513d336988e2c793ab48d80864  mag-room/native/magroom.cpp
          a0203e687f0d56b623ded9c110757011750edece9a26485f776209d29f8e7838  mag-room/tests/test_native.py
          5199670a4f8341b7216eb8c54251df9283c286e8ce85c4b0117a3c82971b057f  mag-room/web/index.html
          SUM
          cat > /tmp/after <<'SUM'
          574086896105f53783b7952faa2c7a3a398ab51e1e6970747ffbb777b8aeb01b  mag-room/native/magroom.cpp
          23850fc6c82aa70e9c89e434f49e303521fb3fb77d4fef8115317e83c0e847f1  mag-room/tests/test_native.py
          b1c2b15b7f7803a1da8ffaf2c05a0ac420dcc70c58b824e9f14600e4d14aff78  mag-room/web/index.html
          SUM
          sed -i 's/^ *//' /tmp/before /tmp/after
          sha256sum -c /tmp/before
          git apply --unidiff-zero .one-shot/0013.diff
          sha256sum -c /tmp/after
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add mag-room/native/magroom.cpp mag-room/tests/test_native.py mag-room/web/index.html
          git commit -m 'Room: tool calls as paired rows with input and output (kept on the message), "Liest Verlauf" instead of a bare "Denkt nach" before the first token'
          git push origin HEAD:room/tool-trace
