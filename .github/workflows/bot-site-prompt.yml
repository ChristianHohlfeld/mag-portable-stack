name: Apply bot site prompt
on:
  push:
    branches: [cursor/bot-subdomains-fe15]
    paths: [.github/workflows/bot-site-prompt.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/bot-subdomains-fe15
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch stable VM rules and drop this workflow
        run: |
          python3 << 'PY'
          import hashlib
          from pathlib import Path
          path = Path("mag-room/native/magroom.cpp")
          text = path.read_text()
          old = (
              '    "damit surfen. Stuetze Aussagen ueber deine VM auf echte Werkzeugausgaben "\n'
          )
          new = (
              '    "damit surfen. Deine eigene Tailnet-Website ist "\n'
              '    "https://{vm}.bot.stardenburg.de (nur im Tailnet, nicht oeffentlich). "\n'
              '    "Dateien in /home/bot/www veroeffentlichst du mit bash /home/bot/publish-site. "\n'
              '    "Lies /home/bot/SITE.md. Stuetze Aussagen ueber deine VM auf echte Werkzeugausgaben "\n'
          )
          if "https://{vm}.bot.stardenburg.de" not in text:
              if old not in text:
                  raise SystemExit("VM_RULES anchor missing")
              text = text.replace(old, new, 1)
              path.write_text(text)
          data = path.read_bytes()
          blob = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
          expect = "fd9ad6aad511fafc3bd45dfa9c0467785eb9a617"
          if blob != expect:
              raise SystemExit(f"magroom blob {blob} != {expect}")
          Path(".github/workflows/bot-site-prompt.yml").unlink()
          print("patched", blob)
          PY
      - name: Commit the prompt sentence
        run: |
          git config user.name "cursor"
          git config user.email "cursor@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "$(cat <<'EOF'
          Tell each bot VM about its tailnet site

          The stable VM rules name https://{vm}.bot.stardenburg.de, /home/bot/www, and /home/bot/SITE.md. Chat-only bots do not get this sentence.
          EOF
          )"
          git push origin HEAD:cursor/bot-subdomains-fe15
