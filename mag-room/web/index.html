<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#17181b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MAG">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>MAG</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.svg?v={{V}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png?v={{V}}">
<link rel="stylesheet" href="/app/app.css?v={{V}}">
<script defer src="/static/marked.min.js?v={{V}}"></script>
<script defer src="/static/purify.min.js?v={{V}}"></script>
<script defer src="/static/highlight.min.js?v={{V}}"></script>
<script defer src="/app/core.js?v={{V}}"></script>
<script defer src="/app/viewer3d.js?v={{V}}"></script>
<script defer src="/app/messages.js?v={{V}}"></script>
<script defer src="/app/mention.js?v={{V}}"></script>
<script defer src="/app/composer.js?v={{V}}"></script>
<script defer src="/app/dictate.js?v={{V}}"></script>
<script defer src="/app/live.js?v={{V}}"></script>
<script defer src="/app/panels.js?v={{V}}"></script>
<script defer src="/app/speak.js?v={{V}}"></script>
</head>
<body>
<div id="app">
  <header id="top">
    <div id="chips" style="display:contents"></div>
    <span id="offline" hidden>keine Verbindung</span>
    <span class="spacer"></span>
    <button id="clear" class="icon-btn" aria-label="Raum leeren" title="Raum und Bot-Kontext leeren" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></button>
    <button id="settings" class="icon-btn" aria-label="Einstellungen" title="Einstellungen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </header>
  <main id="scroll" aria-live="polite">
    <button id="older" hidden>Ältere Nachrichten laden</button>
    <div id="empty" hidden><b>Hallo Chris.</b>Schreib einfach los: Lena und Noah lesen mit.</div>
    <div id="list"></div>
    <div id="activity"></div>
  </main>
  <div id="dock">
    <button id="jump" aria-label="Nach unten" title="Nach unten" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg><span></span></button>
    <footer id="composer">
      <div class="field">
        <div id="staged"></div>
        <div class="row">
          <button id="attach" class="icon-btn" aria-label="Anhängen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <div class="inwrap"><div id="mirror" aria-hidden="true"></div><textarea id="input" rows="1" placeholder="Nachricht" autocomplete="off" enterkeyhint="enter" aria-label="Nachricht"></textarea></div>
          <button id="mic" class="icon-btn" aria-label="Diktieren" title="Diktieren" aria-pressed="false" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button id="send" aria-label="Senden" disabled></button>
        </div>
      </div>
    </footer>
  </div>
</div>
</body>
</html>
