name: One-shot apply push-permission
on:
  push:
    branches: [room/push-permission]
    paths: ['.github/workflows/apply-push-permission.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room/push-permission
      - name: Apply diff and verify
        run: |
          set -e
          cat > /tmp/before <<'HASHES'
          4fe5ec15ac6436ff20ce0ee75d025786e79593b17962a3a34fe37dcfd8fe0d6f  mag-room/web/index.html
          fc458c97ab0f33dd21072fe49c565e0c24dde3184d2596a41567a8b12e096599  mag-room/tests/test_native.py
          HASHES
          cat > /tmp/after <<'HASHES'
          012dd72adba0ce6c6b4a55c0c12e278c14f3b2482ff75ae414925d0277625fcb  mag-room/web/index.html
          873cd0ca8d4cb79ffe0f24efe2f57fb3b47ddb8fae2d9daead3713114b0caf60  mag-room/tests/test_native.py
          HASHES
          sed -i 's/^ *//' /tmp/before /tmp/after
          sha256sum -c /tmp/before
          git apply --unidiff-zero .one-shot/0019.diff
          sha256sum -c /tmp/after
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add mag-room/web/index.html mag-room/tests/test_native.py
          git commit -m 'Room: ask for notifications only while the browser will still show the prompt'
          git push origin HEAD:room/push-permission
