name: Green main
# Promotion and deploy run on Gitea (.gitea/workflows/green.yml). This file
# stays workflow_dispatch only. The job is skipped so a dispatch starts no
# GitHub-hosted runner and cannot move green or deploy.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  skip:
    if: false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: gitea owns green
        timeout-minutes: 1
        run: echo 'GitHub does not promote green or deploy.'
