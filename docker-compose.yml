version: "3.8"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: mag-ollama
    restart: unless-stopped
    runtime: ${DOCKER_RUNTIME:-runc}
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_FLASH_ATTENTION: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_CONTEXT_LENGTH: 8192
    volumes:
      - ./models/ollama/.ollama:/root/.ollama
    ports:
      - "${HOST_OLLAMA_PORT:-11434}:11434"

  comfyui-flux:
    build:
      context: ./comfyui
    container_name: mag-comfyui-flux
    restart: unless-stopped
    runtime: ${DOCKER_RUNTIME:-runc}
    command: ["8187", "/data/comfyui-gpu2.db"]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      PYTHONUNBUFFERED: 1
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      COMFY_MEMORY_FRACTION: "0.95"
      OMP_NUM_THREADS: "7"
    volumes:
      - ./models:/opt/comfyui/models
      - ./workflows/blueprints:/opt/comfyui/blueprints
      - ./config:/data
      - ./comfyui/output:/opt/comfyui/output
      - ./comfyui/input:/opt/comfyui/input
    ports:
      - "${HOST_COMFY_FLUX_PORT:-8187}:8187"

  comfyui-wan:
    build:
      context: ./comfyui
    container_name: mag-comfyui-wan
    restart: unless-stopped
    runtime: ${DOCKER_RUNTIME:-runc}
    command: ["8188", "/data/comfyui-gpu1.db"]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      PYTHONUNBUFFERED: 1
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      COMFY_MEMORY_FRACTION: "0.95"
      OMP_NUM_THREADS: "7"
    volumes:
      - ./models:/opt/comfyui/models
      - ./workflows/blueprints:/opt/comfyui/blueprints
      - ./config:/data
      - ./comfyui/output:/opt/comfyui/output
      - ./comfyui/input:/opt/comfyui/input
    ports:
      - "${HOST_COMFY_WAN_PORT:-8188}:8188"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: mag-open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "True"
      ENABLE_WEBSOCKET_SUPPORT: "true"
    volumes:
      - ./open-webui-data/.open-webui:/app/backend/data
    ports:
      - "${HOST_OPENWEBUI_PORT:-3000}:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: mag-nginx
    restart: unless-stopped
    depends_on:
      - open-webui
      - comfyui-flux
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
