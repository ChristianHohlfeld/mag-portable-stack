# Ubuntu's nginx.service has Restart=no: a crash (or a failed bind before
# tailscaled is up after boot) would leave the room unreachable until manual
# action. Installed by ops/deploy.sh; takes effect on daemon-reload, no restart.
[Service]
Restart=on-failure
RestartSec=5s
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=10
