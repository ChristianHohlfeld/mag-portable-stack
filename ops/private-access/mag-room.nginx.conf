# Source of truth: /etc/nginx/sites-available/mag-room.conf
# Clients still open https://mag.stardenburg.de/ on 100.123.114.16:443.
# tailscaled owns that address and forwards raw TLS (PROXY protocol v2) to
# 127.0.0.1:4443. This listen line must match pages, bots and Gitea exactly.
# Do not bind the Tailscale IP here. Identity comes solely from tailscaled
# LocalAPI via native C++ magroom ($remote_addr is the PROXY client).
# This file is included from nginx's http{} context on Ubuntu 24.04.
map $http_upgrade $mag_connection_upgrade {
    default upgrade;
    ''      close;
}
# Funnel TCP shares 127.0.0.1:4443. $remote_addr is the PROXY v2 client.
# Pages and bots use $mag_tailnet_ok from this geo. deploy-nginx.sh stage
# installs the snippet from the new release before nginx -t, so this path
# exists while /opt/mag-stack/current still points at the previous release.
include /etc/nginx/snippets/mag-tailnet-ok.inc;
server {
    listen 127.0.0.1:4443 ssl http2 proxy_protocol;
    server_name mag.stardenburg.de;
    ssl_certificate     /etc/mag-nginx/tls/cert.pem;
    ssl_certificate_key /etc/mag-nginx/tls/key.pem;
    # Funnel TCP shares :443. Public PROXY clients must not reach this vhost
    # via SNI or Host. real_ip + PROXY so allow/deny see the client, not
    # tailscaled's 127.0.0.1 connect.
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    allow 127.0.0.1;
    allow ::1;
    deny all;
    if ($mag_tailnet_ok = 0) { return 403; }

    client_max_body_size 64m;
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # NO client-supplied X-Tailscale-* is forwarded. This internal
    # subrequest alone obtains identity for the original TCP peer.
    location = /_mag_whois {
        internal;
        auth_request off; # prevent auth subrequest recursion
        proxy_pass http://127.0.0.1:8766/_internal/tailscale/whois;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Mag-Remote "$remote_addr:$remote_port";
        proxy_set_header X-Tailscale-User "";
        proxy_set_header X-Tailscale-Name "";
        proxy_set_header X-Tailscale-Login "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }
    auth_request /_mag_whois;
    # Speech assets retain the Tailscale identity gate; optional until first release.
    # Wildcard include must be under this private HTTPS server, NOT the public vhost.
    include /opt/mag-stack/current/ops/nginx/mag-speech*.inc;
    auth_request_set $mag_user  $upstream_http_x_tailscale_user;
    auth_request_set $mag_name  $upstream_http_x_tailscale_name;
    auth_request_set $mag_login $upstream_http_x_tailscale_login;
    auth_request_set $mag_node $upstream_http_x_tailscale_node;
    auth_request_set $mag_ip $upstream_http_x_tailscale_ip;
    auth_request_set $mag_guest $upstream_http_x_tailscale_guest;
    auth_request_set $mag_proof $upstream_http_x_mag_auth_proof;

    # Host/deploy curl --resolve mag.stardenburg.de:443:100.123.114.16
    # https://mag.stardenburg.de/readyz must not depend on whois.
    location = /readyz {
        auth_request off;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        access_log off;
    }

    # Prevent direct client access to the internal native auth route.
    location = /_internal/tailscale/whois {
        auth_request off;
        return 404;
    }

    # All requests, including WebSockets and SSE, share the same trusted auth.
    # Include each proxy header explicitly; never forward X-Forwarded-For
    # as an identity signal. Backend only trusts loopback proxy headers.
    location / {
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tailscale-User $mag_user;
        proxy_set_header X-Tailscale-Name $mag_name;
        proxy_set_header X-Tailscale-Login $mag_login;
        proxy_set_header X-Tailscale-Node $mag_node;
        proxy_set_header X-Tailscale-IP $mag_ip;
        proxy_set_header X-Tailscale-Guest $mag_guest;
        proxy_set_header X-Mag-Auth-Proof $mag_proof;
        proxy_set_header X-Mag-Remote "";
        proxy_set_header Connection $mag_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
    }

    # No-cache for the HTML app shell, SW, manifest, and all APIs.
    location ~ ^/(?:$|index\.html$|sw\.js$|manifest(?:\.webmanifest|\.json)$|favicon\.ico$|favicon\.svg$|apple-touch-icon\.png$|api(?:/|$)) {
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        proxy_pass http://127.0.0.1:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Tailscale-User $mag_user;
        proxy_set_header X-Tailscale-Name $mag_name;
        proxy_set_header X-Tailscale-Login $mag_login;
        proxy_set_header X-Tailscale-Node $mag_node;
        proxy_set_header X-Tailscale-IP $mag_ip;
        proxy_set_header X-Tailscale-Guest $mag_guest;
        proxy_set_header X-Mag-Auth-Proof $mag_proof;
        proxy_set_header X-Mag-Remote "";
        proxy_set_header Connection $mag_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_buffering off;  # /api/events SSE: never delay events
        proxy_request_buffering off;
        proxy_cache off;
    }
}
