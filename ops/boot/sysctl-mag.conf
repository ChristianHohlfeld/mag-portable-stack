# MAG host kernel settings (installed as /etc/sysctl.d/60-mag.conf by ./install.sh).
# The two model servers run bound to their NUMA node: no automatic page
# migration, no reclaim of the other node, no compaction of their locked pages.
kernel.numa_balancing = 0
vm.zone_reclaim_mode = 0
vm.compact_unevictable_allowed = 0
# The models are mmapped in many pieces.
vm.max_map_count = 1048576
