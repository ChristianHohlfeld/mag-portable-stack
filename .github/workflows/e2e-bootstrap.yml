name: Blank-host bootstrap (e2e)
# Fresh Ubuntu 24.04 system container -> ops/bootstrap.sh --test-stubs ->
# room /readyz, stub model through the audit gateway, nginx ingress.
# Needs root and podman, so it runs on a GitHub-hosted runner only (the
# self-hosted MAG runners are unprivileged by design).
on:
  push:
    branches: [main]
    paths:
      - 'ops/**'
      - 'CMakeLists.txt'
      - 'mag-room/native/**'
      - '.github/workflows/e2e-bootstrap.yml'
  pull_request:
    paths:
      - 'ops/**'
      - 'CMakeLists.txt'
      - 'mag-room/native/**'
      - '.github/workflows/e2e-bootstrap.yml'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-bootstrap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: podman
        run: command -v podman || { sudo apt-get update && sudo apt-get install -y podman; }
      # Locally (sandboxes without container egress) add --host-network on a
      # disposable host; hosted runners give containers their own network.
      - name: Bootstrap a blank Ubuntu 24.04 container and check /readyz
        run: sudo env MAG_E2E_LOG=/tmp/mag-e2e-bootstrap.log MAG_E2E_MEMORY=12g bash ops/tests/e2e-bootstrap.sh --jobs 4
      - name: Bootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-bootstrap-log
          path: /tmp/mag-e2e-bootstrap.log
          if-no-files-found: ignore
