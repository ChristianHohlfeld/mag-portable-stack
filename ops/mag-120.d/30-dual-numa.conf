# Exactly two model-pinned bots, each with its own persistent KVM VM.
# Only installed after an explicit successful Qwen cutover on NUMA1.
[Service]
Environment=MAG_ROOM_SINGLE_BOT=
Environment=MAG_ROOM_DUAL_NUMA=1
# CPU-only MoE prefill is memory-bandwidth-bound (~20 tokens/s measured on
# prior Q4). Avoid cold 10k-token histories; retain full transcript on disk.
# Bounded working context does NOT remove tools, chat, MCP, or VM capabilities.
Environment=MAG_ROOM_TRANSCRIPT_BYTES=8000
Environment=MAG_ROOM_CONTEXT_BYTES=36000
Environment=MAG_ROOM_TOOL_CONTEXT_BYTES=3500
# Preserve typed MCP tools and their schemas; shorten descriptions only.
Environment=MAG_MCP_TOOL_DESC_BYTES=240
# 16k Qwen backend: reserve up to 4k output without prefill overflow.
Environment=MAG_ROOM_QWEN_MAX_TOKENS=4096
