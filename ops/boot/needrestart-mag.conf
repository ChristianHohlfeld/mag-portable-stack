# Installed by ops/boot/ensure-boot.sh as /etc/needrestart/conf.d/mag-stack.conf.
# Package updates (unattended upgrades, "tailscale update") never restart the
# MAG stack: needrestart leaves these services alone. A model takes minutes to
# load, and a dictation, an answer or a 3D job should not be cut by an upgrade
# nobody asked for. They are restarted by a deploy or by Chris only.
push @{$nrconf{blacklist_rc}},
  qr(^mag-model@.+\.service$), qr(^mag-modeld\.service$), qr(^mag-120\.service$),
  qr(^mag-idol\.service$), qr(^mag-stt\.service$), qr(^mag-audit-.+\.service$),
  qr(^mag-browser-webrtc\.service$), qr(^mag-bots-publish\.service$);
