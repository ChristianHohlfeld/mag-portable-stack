name: CI
permissions:
  contents: read
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build ccache jq libssl-dev libcurl4-openssl-dev libarchive-dev libicu-dev python3-numpy python3-scipy python3-pil
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-
      - name: Build release targets
        run: |
          source ops/build-targets.sh
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build build -j "$(nproc)" --target "${MAG_BUILD_TARGETS[@]}" mag-stt test-group-dispatcher test-model-text s23ctl
      - name: Shell syntax
        run: bash ops/ci/check.sh
      - name: Model supervisor
        run: python3 ops/models/tests/test_modeld.py
      - name: Idol worker (jobs survive restarts, a cut-off photo is refused in words, every model gets its UVs)
        run: |
          python3 ops/idol/tests/test_worker.py
          python3 ops/idol/tests/test_photo.py
          python3 ops/idol/tests/test_unwrap.py
      - name: Scenes (figures get the right skeleton; films survive restarts)
        run: |
          python3 ops/scene/tests/test_rig.py
          python3 ops/scene/tests/test_motion.py
          python3 ops/scene/tests/test_worker.py
      - name: Phone control daemon (not part of a release; the room's phone tools are tested against it)
        run: python3 devices/s23/tests/test_s23ctl.py
      - name: Room contract (fake models, fake guest)
        run: |
          ./build/test-group-dispatcher
          ./build/test-model-text
          python3 mag-room/tests/test_native.py
  secrets:
    name: No secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
