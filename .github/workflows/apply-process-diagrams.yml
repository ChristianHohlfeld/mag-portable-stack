name: One-shot apply process-diagrams
on:
  push:
    branches: [room/process-diagrams]
    paths: ['.github/workflows/apply-process-diagrams.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room/process-diagrams
      - name: Apply diff and verify
        run: |
          set -e
          cat > /tmp/before <<'EOF'
          574086896105f53783b7952faa2c7a3a398ab51e1e6970747ffbb777b8aeb01b  mag-room/native/magroom.cpp
          659d8790ccdb6b3d49e352b497a7b042b8e3d22ffb8308195ad0959eb2a971b1  mag-room/native/mcp.hpp
          024b860dfce34d17c180daba6aa5dea4ed0045b7294a3e5b0d3a350f63a5d9cc  mag-room/native/mcp_routes.hpp
          23850fc6c82aa70e9c89e434f49e303521fb3fb77d4fef8115317e83c0e847f1  mag-room/tests/test_native.py
          EOF
          cat > /tmp/after <<'EOF'
          dfe58c58a14aa364680693bdec0d5a5e4ad2158c0857bfed54fac32e680c1e51  mag-room/native/magroom.cpp
          a543af783e49cb5471354120ae9118721640e02298dcdfed06ed89732707745c  mag-room/native/mcp.hpp
          62fff584f22b29c1c33b8d738825bfd1618f08ad632c9ce37d6ce0aea2d39bd9  mag-room/native/mcp_routes.hpp
          d5da8dba5337e18f93955a45b3c4b627e5f6437dcec560ed1b35e73c92a72215  mag-room/tests/test_native.py
          EOF
          sed -i 's/^ *//' /tmp/before /tmp/after
          sha256sum -c /tmp/before
          git apply --unidiff-zero .one-shot/0015.diff
          sha256sum -c /tmp/after
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add mag-room/native mag-room/tests/test_native.py
          git commit -m 'Room: Digitalisierungsplanung plugin preset (process diagram with public link), MCP sessions per bot, server instructions in the bot prompt'
          git push origin HEAD:room/process-diagrams
