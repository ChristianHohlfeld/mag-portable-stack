name: MAG Pages native C++ / nginx / secrets
on:
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  pages:
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install nginx and C++ link dependencies
        if: runner.environment == 'github-hosted'
        run: sudo apt-get update && sudo apt-get install -y nginx libcurl4-openssl-dev libarchive-dev libssl-dev jq dnsutils
      - name: Native C++ unit tests + MAG compilation
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target test-pages-native magroom -j 4
          ./build/test-pages-native
      - name: Tailnet-only, public opt-in, lego v5 and DNS-01 onboarding tests
        run: bash ops/pages/tests/test-pages-ops.sh
      - name: Full Pages lifecycle and root cleanup regressions
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          bash ops/pages/tests/test-pages-lifecycle.sh
          bash ops/pages/tests/test-pages-tools.sh
          if [ "$RUNNER_ENVIRONMENT" = github-hosted ]; then sudo bash ops/pages/tests/test-pages-sandbox.sh; fi
          for script in ops/pages/*.sh ops/pages/tests/*.sh; do
            bash -n "$script"
          done
      - name: Shell syntax; no new runtime units
        run: |
          for script in ops/pages/*.sh; do
            bash -n "$script"
          done
          test -z "$(find ops/pages \( -name '*.py' -o -name '*.timer' \) -print)"
          test "$(find ops/pages -name '*.service' -printf '%f\n')" = mag-pages-reconcile.service
          grep -F 'ProtectHome=yes' ops/pages/mag-pages-reconcile.service
          ! grep -R -E 'pages-policy.sh \*|sudo -n /usr/local/lib/mag-pages/pages-gc.sh' ops/pages
          ! grep -R -E 'systemctl (restart|stop) (mag-llm|deepseek)' ops/pages
  secrets:
    runs-on: ${{ fromJSON(vars.MAG_RUNS_ON || '"ubuntu-24.04"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

