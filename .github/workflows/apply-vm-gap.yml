name: One-shot apply vm-gap
on:
  push:
    branches: [room/vm-gap]
    paths: ['.github/workflows/apply-vm-gap.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room/vm-gap
      - name: Apply diff and verify
        run: |
          set -e
          cat > /tmp/before <<'SUM'
          1851a5bf7a3b5e22482265ed2a305e60ad1d4852e08c0927619577a36926d6f9  mag-room/native/routes.hpp
          ef344511623db365bdada450bfee2d401fa5bba283f16faa804ee1cacd49786d  mag-room/tests/test_native.py
          39cd312e17acf6d924551869dd5dbf6591fe30ef79fb8475c1a31958be04f8e0  mag-room/web/index.html
          SUM
          cat > /tmp/after <<'SUM'
          a4d1f9c3241a28c9967b19ac3cd1ad12ae817d1f76605a340b58e1cd51f25694  mag-room/native/routes.hpp
          a0203e687f0d56b623ded9c110757011750edece9a26485f776209d29f8e7838  mag-room/tests/test_native.py
          5199670a4f8341b7216eb8c54251df9283c286e8ce85c4b0117a3c82971b057f  mag-room/web/index.html
          SUM
          sed -i 's/^ *//' /tmp/before /tmp/after
          sha256sum -c /tmp/before
          git apply --unidiff-zero .one-shot/0012.diff
          sha256sum -c /tmp/after
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add mag-room/native/routes.hpp mag-room/tests/test_native.py mag-room/web/index.html
          git commit -m 'Room: right sidebar explains chat-only bots instead of "Bot auswählen"; owner can attach a VM to a running bot'
          git push origin HEAD:room/vm-gap
