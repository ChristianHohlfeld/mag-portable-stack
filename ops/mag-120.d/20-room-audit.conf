# /etc/systemd/system/mag-120.service.d/20-room-audit.conf  (installiert von ops/deploy.sh und
# ops/audit/install-audit.sh; ersetzt das alte 20-deepseek-audit.conf, DeepSeek ist stillgelegt)
# magroom (bin/magroom) mit den 4 Ornith-Bots über das zentrale Audit-Gateway.

[Unit]
# Ohne Logging kein Raum: fällt Gateway/Proxy/Firewall aus, stoppt mag-120 mit.
Requires=mag-audit-nft.service mag-audit-gateway.service mag-audit-webproxy.service
After=mag-audit-nft.service mag-audit-gateway.service mag-audit-webproxy.service

[Service]
# Backend = Audit-Gateway :8080 (protokolliert Prompt, Reasoning, Tool-Calls, Antwort).
Environment=MAG_ROOM_BACKEND=http://127.0.0.1:8080/v1/chat/completions
Environment=MAG_ROOM_MODEL=ornith-1.5-35b-a3b
# Denken: on|off
# Standard für "Gründlich denken": aus (Denken kostet auf CPU pro 1.000 Denk-Tokens mehrere Minuten).
# Pro Nachricht umschaltbar über den Schalter "Gründlich denken" im Raum (Aufwand: Template-Standard).
Environment=MAG_ROOM_THINKING=off
# Verlauf in 10er-Blöcken kürzen -> llama-Prompt-Cache greift über mehrere Runden
Environment=MAG_ROOM_HISTORY_STEP=10
# Vier persistente Ornith-Bots, bestehende IDs/VMs und Slots bleiben erhalten.
Environment=MAG_ROOM_SINGLE_BOT=
# Wert mit Leerzeichen -> ganze Zuweisung in Anführungszeichen (sonst trennt systemd am Leerzeichen)
Environment="MAG_ROOM_SINGLE_BOT_NAME=Ornith 1"
# Jeder Bot behält seine eigene KVM-VM (Shell, Git, MCP und Browser).
Environment=MAG_ROOM_SINGLE_BOT_VM=on
# Reasoning zählt zu max_tokens (GPT-OSS "low" kam mit 700 aus)
Environment=MAG_ROOM_MAX_TOKENS=8192
# Timeouts: LLM-Anfrage 60 min (Untergrenze im Code 30 min); Gast-Befehle (run_command) 30 min, in Sekunden
Environment=MAG_ROOM_LLM_TIMEOUT=3600
Environment=MAG_ROOM_GUEST_TIMEOUT=1800
# Kein Modell-Gate mehr (mag-model-gate war DeepSeek): Modellstatus = Ornith-/health über das Gateway.
Environment=MAG_ROOM_MODEL_STATUS=/dev/null

# Web-Zugriffe des Raums selbst (Brave-Suche per curl) über den protokollierenden Proxy.
# NO_PROXY (localhost, VM-Netz) setzt install-audit.sh in 21-audit-net.conf.
Environment=http_proxy=http://127.0.0.1:8888
Environment=https_proxy=http://127.0.0.1:8888
Environment=HTTP_PROXY=http://127.0.0.1:8888
Environment=HTTPS_PROXY=http://127.0.0.1:8888
Environment=SSL_CERT_FILE=/etc/mag-audit/ca-bundle.pem
Environment=CURL_CA_BUNDLE=/etc/mag-audit/ca-bundle.pem

# Sofortmaßnahme gegen Secrets im Journal (systemd >= 253): verdächtige Zeilen verwerfen.
LogFilterPatterns=~(?i)(token=|secret|passw|private[_ -]?key|wg[_ -]?key|udp[_ -]?key|preshared|authorization:|x-subscription-token)
