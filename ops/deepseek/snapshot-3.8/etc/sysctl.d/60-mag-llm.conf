# /etc/sysctl.d/60-mag-llm.conf
# NUMA-Balancing verschiebt sonst laufend Seiten des 155-GB-Modells zwischen den Sockeln
kernel.numa_balancing = 0
# kein lokales Zurückfordern von Page-Cache pro NUMA-Knoten (würde Modellseiten verdrängen)
vm.zone_reclaim_mode = 0
# Speicherverdichtung darf gesperrte (mlock) Modellseiten nicht verschieben -> keine Latenzspitzen
vm.compact_unevictable_allowed = 0
