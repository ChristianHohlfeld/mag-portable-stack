# Render @PUBLIC_IP@ before installation. Never bind wildcard :443: the
# private room has its own Tailnet listener on the same hostname.
server {
    listen @PUBLIC_IP@:80;
    server_name git.mag.stardenburg.de;
    location /.well-known/acme-challenge/ { root /var/lib/mag-gitea-acme; }
    location / { return 301 https://git.mag.stardenburg.de$request_uri; }
}
server {
    listen @PUBLIC_IP@:443 ssl;
    server_name git.mag.stardenburg.de;
    ssl_certificate /etc/mag-gitea-acme/certificates/git.mag.stardenburg.de.crt;
    ssl_certificate_key /etc/mag-gitea-acme/certificates/git.mag.stardenburg.de.key;
    client_max_body_size 256m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host git.mag.stardenburg.de;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
}
