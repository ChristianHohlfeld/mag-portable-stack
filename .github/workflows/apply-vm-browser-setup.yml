name: One-shot apply vm-browser-setup
on:
  push:
    branches: [room/vm-browser-setup]
    paths: ['.github/workflows/apply-vm-browser-setup.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: room/vm-browser-setup
      - name: Apply diff and verify
        run: |
          set -e
          cat > /tmp/before <<'HASHES'
          00fe4f4fa7701bc44123c2c49a0a14b12dad3502134efaae65ecdd95cdd9442a  mag-room/native/vm.cpp
          HASHES
          cat > /tmp/after <<'HASHES'
          cf4dc5e4b163f5a1ecef7f14ca9f013de84481201014b802fd6ec19104cfc767  mag-room/native/vm.cpp
          HASHES
          sed -i 's/^ *//' /tmp/before /tmp/after
          sha256sum -c /tmp/before
          git apply --unidiff-zero .one-shot/0018.diff
          sha256sum -c /tmp/after
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898299+github-actions[bot]@users.noreply.github.com'
          git add mag-room/native/vm.cpp
          git commit -m 'Room: do not destroy a new bot when browser setup fails'
          git push origin HEAD:room/vm-browser-setup
