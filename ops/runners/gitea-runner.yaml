log:
  level: info
runner:
  file: /var/lib/mag-runner/.runner
  capacity: 1
  # Job cap, plus hard bounds on shutdown and on each poll of Gitea.
  timeout: 1h
  shutdown_timeout: 30s
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "mag:host"
    - "self-hosted:host"
cache:
  enabled: false
host:
  workdir_parent: /var/lib/mag-runner/work
