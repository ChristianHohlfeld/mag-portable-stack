# Two stable NUMA bots, one persistent KVM workspace per bot.
# Do not optimize latency by silently discarding coding context.
# The Qwen service uses 32k token context and a larger server-side KV cache.
# MAG stores full conversations, state, tools, and VM files independently.
[Service]
Environment=MAG_ROOM_SINGLE_BOT=
Environment=MAG_ROOM_DUAL_NUMA=1
# The initial 8k/36k-byte reduction harmed long coding sessions. Restore
# verified pre-change byte budgets and full typed MCP tool descriptions.
Environment=MAG_ROOM_TRANSCRIPT_BYTES=16000
Environment=MAG_ROOM_CONTEXT_BYTES=52000
Environment=MAG_ROOM_TOOL_CONTEXT_BYTES=6000
Environment=MAG_ROOM_REASONING_HISTORY_BYTES=4096
Environment=MAG_MCP_TOOL_DESC_BYTES=700
# The 32k Qwen model must reserve 8k output tokens; Q4 also retains its own 8192 limit.
Environment=MAG_ROOM_QWEN_MAX_TOKENS=8192
# Agent coding jobs can continue for twelve hours without being truncated by
# the four-hour default. Queue, bot VM and room state stay persisted.
Environment=MAG_ROOM_RUN_BUDGET_S=43200
Environment=MAG_ROOM_MAX_STEPS=256
